worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_strict:10m rate=2r/s;

    # Map to handle websocket Connection header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_backend {
        server api:3000;
    }

    upstream cdn_backend {
        server cdn:80;
    }

    upstream ws_backend {
        server socket:3001;
    }

    upstream nginx-frontend {
        server frontend:80;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;  # replace with your domain
        # Redirect all http to https
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost;  # replace with your domain

        ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Serve frontend static files via proxy
        location / {
            proxy_pass http://nginx-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # CDN proxying - forwards /cdn/* to cdn_backend
        location /cdn/ {
            proxy_pass http://cdn_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffers 8 16k;
            proxy_buffer_size 32k;
            rewrite ^/cdn/(.*)$ /$1 break;
        }

        # API proxying - forwards /api/* to api_backend
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            rewrite ^/api/(.*)$ /$1 break;
        }
        # WebSocket proxying - handles /websocket path for ws and wss
        location /websocket/ {
            proxy_pass http://ws_backend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;
            rewrite ^/websocket/(.*)$ /$1 break;
        }

        # Optional health check or robots
        location = /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}