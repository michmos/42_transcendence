// Simple SPA router class with dynamic route support
class Router {
  constructor() {
    this.routes = {};
    this.dynamicRoutes = [];
    this.fallbackHandler = null;
    
    window.addEventListener('popstate', () => this.handleRoute());
  }

  addRoute(path, handler) {
    this.routes[path] = handler;
  }

  addDynamicRoute(pattern, handler) {
    // Convert pattern like '/info/:id' to regex
    const regexPattern = pattern.replace(/:([^/]+)/g, '([^/]+)');
    const regex = new RegExp('^' + regexPattern + '
</html>
);
    this.dynamicRoutes.push({ pattern: regex, handler });
  }

  setFallbackHandler(handler) {
    this.fallbackHandler = handler;
  }

  navigate(path) {
    history.pushState(null, '', path);
    this.handleRoute();
  }

  handleRoute() {
    const path = window.location.pathname;

    // First check exact routes
    const handler = this.routes[path];
    if (handler) {
      handler();
      return;
    }

    // Then check dynamic routes
    for (const dynamicRoute of this.dynamicRoutes) {
      const match = path.match(dynamicRoute.pattern);
      if (match) {
        // Extract parameters
        const params = match.slice(1); // Remove the full match, keep captured groups
        dynamicRoute.handler({ params, path });
        return;
      }
    }

    // Use fallback handler if available
    if (this.fallbackHandler) {
      this.fallbackHandler(path);
      return;
    }

    // Final fallback - show 404 or handle as needed
    console.warn('No route handler found for path: ' + path);
  }
}

// Route utilities
function renderContent(html) {
  const appContainer = document.getElementById('app');
  if (appContainer) {
    appContainer.innerHTML = html;
  } else {
    document.body.innerHTML = html;
  }
  
  // Trigger component system refresh after content is rendered
  setTimeout(() => {
    // Check if global component system is available
    const globalComponents = window.Components;
    if (globalComponents && typeof globalComponents.refresh === 'function') {
      console.log('🔄 Refreshing component system after route content loaded');
      globalComponents.refresh();
    } else {
      // Fallback: dispatch event for component system
      console.log('🔄 Dispatching component system refresh event after route content loaded');
      window.dispatchEvent(new CustomEvent('componentSystemRefresh'));
    }
  }, 50); // Small delay to ensure DOM is updated
}

// Dynamic route loading
async function renderDynamicRoute(routePath) {
  try {
    let htmlPath;
    let cssPath;

    // Determine file paths based on route
    if (routePath === '') {
      // Root route - files are directly in /src/routes/
      htmlPath = '/src/routes/index.html';
      cssPath = '/src/routes/index.css';
    } else {
      // Subfolder routes - files are in /src/routes/{routePath}/
      htmlPath = '/src/routes/' + routePath + '/index.html';
      cssPath = '/src/routes/' + routePath + '/index.css';
    }

    // Load HTML content
    const htmlResponse = await fetch(htmlPath);
    if (!htmlResponse.ok) {
      throw new Error('Failed to load HTML for route: ' + (routePath || 'root'));
    }
    const content = await htmlResponse.text();

    // Clean up any existing route-specific styles first
    const existingRouteStyles = document.querySelectorAll('style[data-route]');
    existingRouteStyles.forEach((style) => style.remove());

    // Try to load and inject CSS if it exists
    try {
      const cssResponse = await fetch(cssPath);
      if (cssResponse.ok) {
        const cssContent = await cssResponse.text();
        // Create style tag for this route and append it to head (after main CSS)
        const style = document.createElement('style');
        style.setAttribute('data-route', routePath || 'home');
        style.textContent = cssContent;
        // Append to head to ensure it comes after the main CSS link tag
        document.head.appendChild(style);
      }
    } catch {
      // CSS file doesn't exist, that's ok
      console.log('No CSS file found for route: ' + (routePath || 'root'));
    }

    // Render the HTML content to the page
    renderContent(content);

    // Try to load and execute route JavaScript if it exists
    try {
      const jsPath = routePath === '' ? '/src/routes/index.js' : '/src/routes/' + routePath + '/index.js';
      const module = await import(jsPath);
      
      // Call route initialization if it exists
      if (module && module.initRoute && typeof module.initRoute === 'function') {
        module.initRoute();
      }
    } catch {
      console.log('No TypeScript file found for route: ' + (routePath || 'root'));
    }
  } catch (error) {
    console.error('Error loading route content for ' + (routePath || 'root') + ':', error);
    renderContent('<h1>Error loading ' + (routePath || 'home') + ' page</h1>');
  }
}

// Dynamic route handler with parameters
async function renderDynamicRouteWithParams(routeInfo) {
  try {
    const { params, path } = routeInfo;

    // Extract the base route name from the path
    const pathSegments = path.split('/').filter((segment) => segment !== '');

    // If this is the root path, it should not be handled as a dynamic route
    if (pathSegments.length === 0) {
      console.log('Root path detected in dynamic handler, falling back to static route');
      renderDynamicRoute('');
      return;
    }

    const baseRouteName = pathSegments[0]; // e.g., "info" from "/info/123"

    if (!baseRouteName) {
      console.error('No base route name found for path:', path);
      renderContent('<h1>Page Not Found</h1><p>Invalid route path.</p>');
      return;
    }

    // Try to find a matching dynamic folder (with [param] pattern)
    const dynamicFolderName = baseRouteName + '[id]'; // Convention: routename[id]

    // Determine file paths for dynamic route
    const htmlPath = '/src/routes/' + dynamicFolderName + '/index.html';
    const cssPath = '/src/routes/' + dynamicFolderName + '/index.css';

    // Load HTML content
    const htmlResponse = await fetch(htmlPath);
    if (!htmlResponse.ok) {
      // If dynamic route doesn't exist, fall back to static route handling
      console.log('Dynamic route ' + dynamicFolderName + ' not found, trying static route');
      renderDynamicRoute(baseRouteName);
      return;
    }
    const content = await htmlResponse.text();

    // Clean up any existing route-specific styles first
    const existingRouteStyles = document.querySelectorAll('style[data-route]');
    existingRouteStyles.forEach((style) => style.remove());

    // Try to load and inject CSS if it exists
    try {
      const cssResponse = await fetch(cssPath);
      if (cssResponse.ok) {
        const cssContent = await cssResponse.text();
        // Create style tag for this route and append it to head (after main CSS)
        const style = document.createElement('style');
        style.setAttribute('data-route', baseRouteName);
        style.textContent = cssContent;
        // Append to head to ensure it comes after the main CSS link tag
        document.head.appendChild(style);
      }
    } catch {
      console.log('No CSS file found for dynamic route: ' + dynamicFolderName);
    }

    // Render the content first
    renderContent(content);

    // Try to load and execute TypeScript if it exists (after rendering)
    try {
      const jsPath = '/src/routes/' + dynamicFolderName + '/index.js';
      const module = await import(jsPath);

      // Call route initialization if it exists, passing parameters
      if (module && module.initRoute && typeof module.initRoute === 'function') {
        // Create parameter object based on convention
        const routeParams = { id: params[0] }; // First param is always 'id' by convention
        module.initRoute(routeParams);
      }
    } catch (tsError) {
      console.error('Error loading TypeScript for dynamic route: ' + dynamicFolderName, tsError);
    }
  } catch (error) {
    console.error('Error loading dynamic route content:', error);
    renderContent('<h1>Page Not Found</h1><p>Could not find route files for this path.</p>');
  }
}

// Route path detection functions
function isDynamicRoutePath(path) {
  const segments = path.split('/').filter((segment) => segment !== '');

  // Root path is always static
  if (segments.length === 0) return false;

  // Single segment paths are static routes (e.g., /about)
  if (segments.length === 1) return false;

  // Paths with 2+ segments could be dynamic (e.g., /info/123, /user/456)
  if (segments.length >= 2) {
    // Check if this looks like a dynamic route by checking if the second segment is a parameter
    // For now, assume any path with 2+ segments is potentially dynamic
    return true;
  }

  return false;
}

// Function to handle dynamic route paths
function handleDynamicRoutePath(path) {
  const segments = path.split('/').filter((segment) => segment !== '');

  if (segments.length >= 2) {
    // Extract parameters - everything after the base route name
    const params = segments.slice(1);
    renderDynamicRouteWithParams({ params, path });
  }
}

// Function to handle static route paths
function handleStaticRoutePath(path) {
  // Extract route name from path
  let routeName = '';
  if (path === '/' || path === '') {
    routeName = ''; // Root route
  } else {
    // Remove leading slash and use as route name
    routeName = path.substring(1);
    // Handle nested paths - use first segment as route name
    if (routeName.includes('/')) {
      const firstSegment = routeName.split('/')[0];
      routeName = firstSegment || '';
    }
  }

  // Try to render the dynamic route
  renderDynamicRoute(routeName);
}

// Initialize router and set up routing
function initializeRouting() {
  const router = new Router();

  // Fully dynamic route registration - NO hardcoding!
  // Routes are automatically discovered and registered based on URL patterns and folder structure

  // Fallback handler for all routes - dynamically discovers route files and patterns
  router.setFallbackHandler((path) => {
    // Check if this path matches a dynamic route pattern (contains parameters)
    if (isDynamicRoutePath(path)) {
      handleDynamicRoutePath(path);
    } else {
      // Handle static routes
      handleStaticRoutePath(path);
    }
  });

  // Handle navigation clicks - use event delegation for dynamically loaded content
  document.addEventListener('click', (e) => {
    const target = e.target;
    if (target.tagName === 'A' && target.hasAttribute('data-link')) {
      e.preventDefault();
      e.stopPropagation();
      const href = target.getAttribute('href');
      if (href) {
        router.navigate(href);
      }
    }
  });

  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      router.handleRoute();
    });
  } else {
    router.handleRoute();
  }

  console.log('🚀 Routes plugin initialized');
}

// Auto-initialize when script loads
initializeRouting();
