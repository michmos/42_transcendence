<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <h1>Look at the console log to see if the connection happened</h1>

    <button id="getUsersBtn">Get Users</button>
    <button id="makeUserBtn">Make User</button>
    <button id="delUserBtn">Delete User</button>
    <br />
  

    <div id="userContainer">
      <h2>Users:</h2>
      <div id="userList">
    </div>
    

    

    <script>

      async function getUsers() {
        await fetch('/api/user')
            .then(response => response.json())
            .then(data => {
              console.log('Users:', data);

              const userList = document.getElementById('userList');
              if (userList) {
                userList.remove();
              }
              const ul = document.createElement('ul');
              ul.id = 'userList';
              data.message.forEach(user => {
                const li = document.createElement('li');
                li.textContent = `ID: ${user.id}, Email: ${user.email}`;
                ul.appendChild(li);
              });
              document.body.appendChild(ul);
            })
            .catch(error => console.error('Error fetching users:', error));
      }
      
      window.onload = function() {
        getUsers();
      };

      document.getElementById('getUsersBtn').onclick = async function() {
        await getUsers();  
      };

      document.getElementById('getUsersBtn').onclick = async function() {
        fetch('/api/user')
          .then(response => response.json())
          .then(data => {
            console.log('Users:', data);

            const userList = document.getElementById('userList');
            if (userList) {
              userList.remove();
            }
            const ul = document.createElement('ul');
            ul.id = 'userList';
            data.message.forEach(user => {
              const li = document.createElement('li');
              li.textContent = `ID: ${user.id}, Email: ${user.email}`;
              ul.appendChild(li);
            });
            document.body.appendChild(ul);
          })
          .catch(error => console.error('Error fetching users:', error));
      };

      document.getElementById('makeUserBtn').onclick = async function() {
        await fetch('/api/user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ /* user data here */ })
        })
          .then(response => response.json())
          .then(async data => {
            console.log('User created:', data)
            await getUsers();
          })
          .catch(error => console.error('Error creating user:', error));
      };
      document.getElementById('delUserBtn').onclick = async function() {
        await fetch('/api/user', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ /* user data here */ })
        })
          .then(response => response.json())
          .then(async data => {
            console.log('User deleted:', data)
            await getUsers();
          })
          .catch(error => console.error('Error deleting user:', error));
      };
    </script>
  </body>
  <script>
    // Replace with your WebSocket server URL
    const socket = new WebSocket('ws://localhost:3000/websocket');

    socket.onopen = function() {
      console.log('WebSocket connection established');

      socket.send('Hello Server!');
    };

    socket.onmessage = function(event) {
      console.log('Message from server:', event.data);
    };

    socket.onclose = function() {
      console.log('WebSocket connection closed');
    };

    socket.onerror = function(error) {
      console.error('WebSocket error:', error);
    };
  </script>
</html>
