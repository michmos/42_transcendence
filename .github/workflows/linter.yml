name: linting CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'

    - name: setup pnpm
      uses: pnpm/action-setup@v4

    - name: install dependencies
      run: pnpm install

    - name: run linter
      run: pnpm lint
